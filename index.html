<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Quản Trị - Xét Duyệt Hồ Sơ IOE</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        body { background-color: #f4f7f6; }
        .header {
            background-color: #004085;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { margin: 0; font-size: 20px; }
        .logout-btn {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }
        .logout-btn:hover { background-color: #c82333; }
        .container { padding: 20px; max-width: 1300px; margin: 0 auto; }
        .page-title { color: #333; margin-bottom: 20px; }

        .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
        @media (max-width: 800px) { .stats-row { grid-template-columns: repeat(2, 1fr); } }
        .stat-card { background: #fff; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); padding: 16px; text-align: center; }
        .stat-card .num { font-size: 26px; font-weight: 800; }
        .stat-card .lbl { font-size: 12.5px; color: #6b7a72; margin-top: 2px; }
        .stat-card.total .num { color: #004085; }
        .stat-card.pending .num { color: #b8860b; }
        .stat-card.approved .num { color: #28a745; }
        .stat-card.rejected .num { color: #dc3545; }

        .toolbar {
            display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
            background: #fff; padding: 14px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            margin-bottom: 16px;
        }
        .toolbar input, .toolbar select {
            padding: 9px 10px; border: 1px solid #d7ded9; border-radius: 6px; font-size: 14px;
        }
        .toolbar input[type="text"] { flex: 1; min-width: 200px; }
        .toolbar .btn { padding: 9px 16px; font-size: 14px; }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
        }
        th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid #ddd; font-size: 13.5px; }
        th { background-color: #f8f9fa; font-weight: bold; color: #333; white-space: nowrap; }
        tr:hover { background-color: #f1f1f1; }
        .empty-row td { text-align: center; color: #888; padding: 30px; }

        .status { padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; white-space: nowrap; }
        .status.pending { background-color: #ffc107; color: #856404; }
        .status.approved { background-color: #28a745; color: white; }
        .status.rejected { background-color: #dc3545; color: white; }

        .action-btn {
            border: none; padding: 6px 11px; border-radius: 4px; cursor: pointer;
            font-size: 12.5px; color: white; margin-right: 4px; margin-bottom: 4px;
        }
        .btn-approve { background-color: #28a745; }
        .btn-approve:hover { background-color: #218838; }
        .btn-reject { background-color: #dc3545; }
        .btn-reject:hover { background-color: #c82333; }
        .btn-view { background-color: #17a2b8; }
        .btn-view:hover { background-color: #138496; }
        .btn-edit { background-color: #6c757d; }
        .btn-edit:hover { background-color: #565e64; }

        /* Modal */
        .modal-backdrop {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45);
            align-items: center; justify-content: center; z-index: 1000; padding: 20px;
        }
        .modal-backdrop.show { display: flex; }
        .modal {
            background: #fff; border-radius: 10px; max-width: 560px; width: 100%;
            max-height: 88vh; overflow-y: auto; padding: 24px;
        }
        .modal h2 { margin-top: 0; font-size: 18px; color: #004085; }
        .modal .close-x {
            float: right; cursor: pointer; font-size: 20px; color: #888; border: none; background: none;
        }
        .detail-row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid #eee; font-size: 14px; }
        .detail-row .label { color: #6b7a72; }
        .detail-row .value { font-weight: 600; text-align: right; max-width: 60%; }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }

        .toast {
            position: fixed; bottom: 20px; right: 20px; background: #212529; color: #fff;
            padding: 12px 18px; border-radius: 8px; font-size: 14px; z-index: 2000;
            opacity: 0; transform: translateY(10px); transition: all 0.25s ease; pointer-events: none;
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.error { background: #a12226; }

        .loading-cell { text-align: center; padding: 30px; color: #888; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Hệ Thống Quản Trị IOE</h1>
        <button class="logout-btn" id="logoutBtn">Đăng xuất</button>
    </div>
    <div class="container">
        <h2 class="page-title">Danh sách hồ sơ đăng ký dự thi</h2>

        <div class="stats-row">
            <div class="stat-card total"><div class="num" id="statTotal">0</div><div class="lbl">Tổng hồ sơ</div></div>
            <div class="stat-card pending"><div class="num" id="statPending">0</div><div class="lbl">Chờ duyệt</div></div>
            <div class="stat-card approved"><div class="num" id="statApproved">0</div><div class="lbl">Đã duyệt</div></div>
            <div class="stat-card rejected"><div class="num" id="statRejected">0</div><div class="lbl">Từ chối</div></div>
        </div>

        <div class="toolbar">
            <input type="text" id="searchInput" placeholder="Tìm theo tên, SĐT, mã thí sinh, địa chỉ...">
            <select id="filterKhoiLop"><option value="all">Tất cả khối lớp</option></select>
            <select id="filterTrangThai">
                <option value="all">Tất cả trạng thái</option>
                <option value="pending">Chờ duyệt</option>
                <option value="approved">Đã duyệt</option>
                <option value="rejected">Đã từ chối</option>
            </select>
            <button class="btn btn-secondary" id="refreshBtn">↻ Làm mới</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>STT</th>
                    <th>Mã Thí Sinh</th>
                    <th>Họ Tên Thí Sinh</th>
                    <th>Khối Lớp</th>
                    <th>Phụ Huynh</th>
                    <th>Số Điện Thoại</th>
                    <th>Trạng Thái</th>
                    <th>Hành Động</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr class="empty-row"><td colspan="8" class="loading-cell">Đang tải dữ liệu...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- Modal xem chi tiết -->
    <div class="modal-backdrop" id="viewModal">
        <div class="modal">
            <button class="close-x" data-close="viewModal">&times;</button>
            <h2>Chi tiết hồ sơ</h2>
            <div id="viewModalBody"></div>
            <div class="modal-actions">
                <button class="btn btn-secondary" data-close="viewModal">Đóng</button>
            </div>
        </div>
    </div>

    <!-- Modal sửa hồ sơ -->
    <div class="modal-backdrop" id="editModal">
        <div class="modal">
            <button class="close-x" data-close="editModal">&times;</button>
            <h2>Sửa hồ sơ</h2>
            <form id="editForm">
                <input type="hidden" id="edit_id">
                <div class="form-group">
                    <label>Mã thí sinh</label>
                    <input type="text" id="edit_ma_thi_sinh" placeholder="VD: 109QOHA">
                </div>
                <div class="row-2">
                    <div class="form-group">
                        <label>Họ tên thí sinh</label>
                        <input type="text" id="edit_ho_ten" required>
                    </div>
                    <div class="form-group">
                        <label>Năm sinh thí sinh</label>
                        <input type="number" id="edit_nam_sinh">
                    </div>
                </div>
                <div class="form-group">
                    <label>Khối lớp</label>
                    <select id="edit_khoi_lop" required></select>
                </div>
                <div class="row-2">
                    <div class="form-group">
                        <label>Họ tên phụ huynh</label>
                        <input type="text" id="edit_ho_ten_phu_huynh" required>
                    </div>
                    <div class="form-group">
                        <label>Năm sinh phụ huynh</label>
                        <input type="number" id="edit_nam_sinh_phu_huynh">
                    </div>
                </div>
                <div class="row-2">
                    <div class="form-group">
                        <label>Số điện thoại</label>
                        <input type="tel" id="edit_sdt_phu_huynh" required>
                    </div>
                    <div class="form-group">
                        <label>Nghề nghiệp</label>
                        <input type="text" id="edit_nghe_nghiep_phu_huynh">
                    </div>
                </div>
                <div class="form-group">
                    <label>Địa chỉ</label>
                    <input type="text" id="edit_dia_chi">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="edit_email">
                </div>
                <div class="form-group">
                    <label>Ghi chú của phụ huynh</label>
                    <textarea id="edit_ghi_chu" rows="2"></textarea>
                </div>
                <div class="form-group">
                    <label>Ghi chú nội bộ (admin)</label>
                    <textarea id="edit_admin_note" rows="2" placeholder="Ghi chú riêng cho ban quản trị"></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" data-close="editModal">Huỷ</button>
                    <button type="submit" class="btn btn-primary" id="saveEditBtn">Lưu thay đổi</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal xác nhận (thay cho confirm() mặc định của trình duyệt) -->
    <div class="modal-backdrop" id="confirmModal">
        <div class="modal" style="max-width:400px;">
            <h2 id="confirmTitle">Xác nhận</h2>
            <p id="confirmMessage"></p>
            <div class="modal-actions">
                <button class="btn btn-secondary" data-close="confirmModal">Huỷ</button>
                <button class="btn btn-danger" id="confirmOkBtn">Xác nhận</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="/admin/admin.js"></script>
</body>
</html>
